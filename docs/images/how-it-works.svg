<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">offbox — how it works</title>
<desc id="desc">Edit worktrees A and B locally. Mutagen synchronizes each to its own host directory, mounted at /work in a separate privileged container. Git history is mirrored separately. The offbox CLI runs commands through SSH and docker exec; SSH tunnels expose remote services on distinct localhost ports.</desc>
