[project]
name = "offbox-python-example"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
