services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: offbox
      POSTGRES_PASSWORD: offbox
      POSTGRES_DB: offbox
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "offbox", "-d", "offbox"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://offbox:offbox@postgres:5432/offbox
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  database:
