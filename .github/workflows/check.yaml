name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: make check
      - run: uv build
      - name: Build a wheel directly from the checkout
        run: uv build --wheel
      - name: Smoke test the wheel
        shell: bash
        run: |
          test "$(uv run --isolated --no-project --with dist/offbox-*.whl offbox --version)" = "$(uv run --frozen offbox --version)"
      - name: ShellCheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          mapfile -d '' shell_files < <(git ls-files -z -- '*.sh' 'images/universal/offbox-init' 'images/universal/offbox-run')
          if ((${#shell_files[@]})); then
            shellcheck "${shell_files[@]}"
          else
            echo 'No shell scripts found.'
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.1"
          terraform_wrapper: false
      - name: Provider schemas and mocked GCP contracts (no cloud credentials)
        run: |
          terraform fmt -check -recursive providers
          terraform -chdir=providers/hetzner init -backend=false -input=false
          terraform -chdir=providers/hetzner validate
          terraform -chdir=providers/gcp init -backend=false -input=false
          terraform -chdir=providers/gcp validate
          terraform -chdir=providers/gcp test -no-color
