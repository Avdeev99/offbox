name: Universal image

on:
  pull_request:
    paths:
      - images/universal/**
      - .github/workflows/image.yaml
      - .github/workflows/image-build.yaml
      - .dockerignore
      - src/offbox/__init__.py
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - images/universal/**
      - .github/workflows/image.yaml
      - .github/workflows/image-build.yaml
      - .dockerignore
      - src/offbox/__init__.py

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/image-build.yaml
    with:
      publish: false

  publish:
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yaml
    with:
      publish: true
      refresh: ${{ github.event_name == 'schedule' }}
