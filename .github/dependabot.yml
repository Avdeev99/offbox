version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /images/universal
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: terraform
    directories:
      - /providers/hetzner
      - /providers/gcp
    schedule:
      interval: weekly
